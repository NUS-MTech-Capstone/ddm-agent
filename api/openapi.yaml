openapi: 3.1.0
info:
  title: DenDenMushi DDM Agent API
  version: 0.1.0
  description: Target-side bounded command execution API.
servers:
  - url: http://localhost:8084
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Agent is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /execute:
    post:
      summary: Execute a bounded command for an authorized session
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionIdHeader"
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/HostIdHeader"
        - $ref: "#/components/parameters/CrIdHeader"
        - $ref: "#/components/parameters/RunIdHeader"
        - $ref: "#/components/parameters/IncidentIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
      responses:
        "200":
          description: Command completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteResult"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SessionIdHeader:
      name: X-DDM-Session-ID
      in: header
      required: false
      description: Required for session-token execution.
      schema:
        type: string
    UserIdHeader:
      name: X-DDM-User-ID
      in: header
      required: false
      description: Required for session-token execution.
      schema:
        type: string
    HostIdHeader:
      name: X-DDM-Host-ID
      in: header
      required: true
      schema:
        type: string
    CrIdHeader:
      name: X-DDM-CR-ID
      in: header
      required: false
      schema:
        type: string
    RunIdHeader:
      name: X-DDM-Run-ID
      in: header
      required: false
      description: Required for automation capability-token execution.
      schema:
        type: string
    IncidentIdHeader:
      name: X-DDM-Incident-ID
      in: header
      required: false
      description: Optional automation incident binding checked against signed STS claims when present.
      schema:
        type: string
  responses:
    Error:
      description: Structured error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
    ExecuteRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string
          description: Command string to execute. The service bounds request size and execution time.
        operation:
          type: string
          description: Required for automation execution and checked against the signed allowed operation list.
    ExecuteResult:
      type: object
      required: [stdout, stderr, exitCode]
      properties:
        stdout:
          type: string
        stderr:
          type: string
        exitCode:
          type: integer
