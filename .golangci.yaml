linters:
  enable:
    - gofmt
    - goimports
    - gosec
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck

linters-settings:
  govet:
    check-shadowing: true
  gofmt:
    simplify: true
  golint:
    min-confidence: 0.8

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor